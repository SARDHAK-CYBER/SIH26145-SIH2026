[package]
name = "stealthtap_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "stealthtap_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
sha2 = "0.10"
# Preserves first-seen (insertion) order under iteration -- std HashMap
# deliberately randomizes iteration order per-process, which does not match
# Python's dict (insertion-ordered by language guarantee since 3.7) that
# pcap_parser.py relies on. That mismatch is not cosmetic: several detection
# engines are stateful and processing-order-sensitive (see the comment on
# `conn` below) -- measured directly against eval_real_traffic.py.
indexmap = "2"
# Runtime loading of libpcap/Npcap (no SDK / import library needed at build time).
libloading = "0.8"

# Linux-only: AF_XDP capture (src/afxdp.rs). Gated at the dependency level,
# not just with #[cfg] in code, so a Windows build (this project's primary
# platform) never fetches or attempts to link libxdp/libbpf at all.
#
# libxdp-sys is pulled in transitively by xsk-rs, but is listed here
# explicitly too, purely to set its build features (Cargo unifies features
# across the dependency graph for one resolved version) -- without this,
# its default build tries to discover libbpf/libelf/zlib via pkg-config
# and compile its own default XDP program with clang, neither of which
# can be assumed present on an arbitrary target machine. `vendored`
# builds libbpf+libelf+zlib from source instead (via the `cc` crate, not
# a Makefile/configure, per `use_cc_build`); `use_precompiled_bpf` uses
# libxdp's own prebuilt default-program object instead of compiling one.
#
# OPT-IN via `--features afxdp` (Linux capture sensors only): the API/streaming
# containers never capture, and building libbpf+elfutils+zlib from source
# needs autotools/flex/bison -- real build time and toolchain for code those
# images would never call.
[target.'cfg(target_os = "linux")'.dependencies]
xsk-rs = { version = "0.11", features = ["use_cc_build"], optional = true }
libxdp-sys = { version = "0.2", features = ["vendored", "use_precompiled_bpf", "use_cc_build"], optional = true }

[features]
default = []
afxdp = ["dep:xsk-rs", "dep:libxdp-sys"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"   # a malformed packet must never crash the whole process -- see src/parse.rs
