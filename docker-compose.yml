# Zeek is deliberately NOT defined here -- it must be attached to the
# "capture" network namespace created by scripts/setup_netns.sh, with
# zero IP and no route anywhere:
#
#   docker run --network=ns:/var/run/netns/capture \
#     --cap-drop=ALL --cap-add=NET_RAW --cap-add=NET_ADMIN \
#     -v stealthtap_zeek_logs:/zeek-logs \
#     stealthtap-zeek
#
# (Verify /zeek-logs matches whatever working directory Zeek is actually
# configured to write conn.log/dns.log/ssl.log/modbus.log/extracted_files
# to in zeek/local.zeek -- adjust the mount path below to match if not.)
#
# EVERYTHING below this line runs on the normal Docker bridge network.
# log-shipper only reads Zeek's already-written JSON log files off the
# shared volume above and produces to Redpanda -- it never touches a raw
# packet and needs no special network placement.

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "127.0.0.1:9092:9092"     # loopback only: never publish a datastore to the network
    restart: unless-stopped
    healthcheck:
      # dependents start only once the broker actually answers -- the
      # log-shipper used to crash at boot ("Unable to bootstrap from
      # redpanda:9092") because depends_on only waited for the container
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  redis:
    # redis-stack-server ships the RedisBloom module (Count-Min Sketch, HLL)
    image: redis/redis-stack-server:7.2.0-v11
    ports:
      - "127.0.0.1:6379:6379"     # loopback only: never publish a datastore to the network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=stealthtap
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set a real password in .env, do not use a default}
      - POSTGRES_DB=stealthtap
    ports:
      - "127.0.0.1:5432:5432"     # loopback only: never publish a datastore to the network
    volumes:
      - stealthtap_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stealthtap -d stealthtap"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Scheduled pg_dump of the alert store into the stealthtap_backups volume (see scripts/pg_backup_loop.sh, pg_restore.sh).
  backup:
    image: postgres:16
    entrypoint: ["sh", "/scripts/pg_backup_loop.sh"]
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:?set a real password in .env, do not use a default}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
    volumes:
      - ./scripts:/scripts:ro
      - stealthtap_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  opensearch:
    restart: unless-stopped
    # Kept for now (existing OT/IT batch path still writes here). Once
    # the PostgreSQL-backed API and React/Grafana dashboard are the
    # primary path, this can be retired -- don't remove it yet, there
    # are still working consumers depending on it.
    image: opensearchproject/opensearch:2.14.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:?set a real password in .env, do not use a default}
    ports:
      - "127.0.0.1:9200:9200"     # loopback only: never publish a datastore to the network

  dashboards:
    restart: unless-stopped
    image: opensearchproject/opensearch-dashboards:2.14.0
    environment:
      - OPENSEARCH_HOSTS=https://opensearch:9200
    ports:
      - "127.0.0.1:5601:5601"     # loopback only: never publish a datastore to the network
    depends_on:
      - opensearch

  log-shipper:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "src/log_shipper.py"]
    environment:
      - REDPANDA_BROKER=redpanda:9092
      - ZEEK_LOG_DIR=/zeek-logs
    volumes:
      - stealthtap_zeek_logs:/zeek-logs:ro
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy

  streaming-engine:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "src.streaming_engine", "worker"]
    environment:
      - REDPANDA_BROKER=kafka://redpanda:9092
      - REDIS_URL=redis://redis:6379/0
      - RELAY_SOCKET=/var/run/stealthtap/alerts.sock
    volumes:
      - stealthtap_relay_socket:/var/run/stealthtap
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      log-shipper:
        condition: service_started

  zeek-batch:
    # NEW: real Zeek (+ ICSNPP OT plugins) for uploaded-pcap analysis,
    # separate from your existing live-capture zeek/Dockerfile. No
    # capture-namespace isolation needed -- this only ever touches files
    # handed to it via the shared volumes below, never a live interface.
    build:
      context: .
      dockerfile: zeek-batch.Dockerfile
    volumes:
      - stealthtap_zeek_incoming:/incoming
      - stealthtap_zeek_outgoing:/outgoing
    restart: unless-stopped

  suricata-batch:
    # Real signature-based network detection (20,829 ET Open rules),
    # complementing zeek-batch (protocol parsing) and YARA (file
    # signatures). Same job-queue pattern, separate volumes -- kept
    # independent rather than sharing zeek-batch's queue.
    build:
      context: .
      dockerfile: suricata-batch.Dockerfile
    volumes:
      - stealthtap_suricata_incoming:/incoming
      - stealthtap_suricata_outgoing:/outgoing
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - DATABASE_URL=postgresql://stealthtap:${POSTGRES_PASSWORD:?set a real password in .env}@${DATABASE_HOST_OVERRIDE:-postgres}:5432/stealthtap
      - STEALTHTAP_API_KEY=${STEALTHTAP_API_KEY:?set STEALTHTAP_API_KEY (>=16 random chars) in .env}
      - STEALTHTAP_CORS_ORIGINS=${STEALTHTAP_CORS_ORIGINS:-http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173,https://localhost}
      - STEALTHTAP_TENANT_KEYS=${STEALTHTAP_TENANT_KEYS:-}    # optional tenant[/role]=key list, e.g. acme=<key>,globex/viewer=<key>
      - STEALTHTAP_TOKEN_SECRET=${STEALTHTAP_TOKEN_SECRET:-}  # signs login tokens (>=32 chars); unset = tokens die on restart
      - STEALTHTAP_USERS=/config/users.json
      - STEALTHTAP_ALLOWLIST=/config/allowlist.json
      - STEALTHTAP_AUDIT_LOG=/audit/audit.jsonl
      - STEALTHTAP_CAPTURE_STORE=/captures          # shared by all API replicas
      - MODELS_DIR=/models
      - ZEEK_INCOMING_DIR=/incoming
      - ZEEK_OUTGOING_DIR=/outgoing
      - SURICATA_INCOMING_DIR=/suricata_incoming
      - SURICATA_OUTGOING_DIR=/suricata_outgoing
    ports:
      - "127.0.0.1:8000:8000"     # plaintext stays on loopback; remote clients use the TLS proxy (:8443)
    volumes:
      - ./models:/models:ro
      - ./config:/config
      - stealthtap_audit:/audit
      - stealthtap_captures:/captures
      - ./samples:/opt/stealthtap/samples:ro   # bundled pcap for GET /api/sample/analysis
      - stealthtap_zeek_incoming:/incoming
      - stealthtap_zeek_outgoing:/outgoing
      - stealthtap_suricata_incoming:/suricata_incoming
      - stealthtap_suricata_outgoing:/suricata_outgoing
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zeek-batch:
        condition: service_started
      suricata-batch:
        condition: service_started

  # ── HIGH AVAILABILITY (profile "ha"): a second API replica and a PostgreSQL hot standby ───────────────────────────────────────
  #   docker compose exec -T postgres sh -c 'grep -q "replication stealthtap" $PGDATA/pg_hba.conf || echo "host replication stealthtap all scram-sha-256" >> $PGDATA/pg_hba.conf; psql -U stealthtap -c "select pg_reload_conf()"'
  #   STEALTHTAP_API_UPSTREAMS="api:8000 api2:8000" docker compose --profile ha up -d
  # Failover of the database is MANUAL (scripts/pg_failover.sh); see docs/OPERATIONS.md section 5 for what is and is not covered.
  api2:
    profiles: ["ha"]
    extends:
      service: api
    ports: !reset []
  postgres-replica:
    profiles: ["ha"]
    image: postgres:16
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:?set a real password in .env}
      - POSTGRES_USER=stealthtap
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set a real password in .env}
      - POSTGRES_DB=stealthtap
    entrypoint: ["sh", "/scripts/pg_replica_entry.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - stealthtap_pg_replica:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    restart: unless-stopped
    build:
      context: ./dashboard-app
      args:
        VITE_API_BASE: ${STEALTHTAP_PUBLIC_API:-http://localhost:8000}   # behind the proxy: https://<STEALTHTAP_HOST>:8443
        VITE_LIVE_API_BASE: http://localhost:8100
    ports:
      - "127.0.0.1:4173:4173"     # plaintext stays on loopback; remote clients use the TLS proxy (:443)
    depends_on:
      - api

  # TLS termination for remote access. Publishes ONLY on ${STEALTHTAP_BIND} (loopback by default): set STEALTHTAP_BIND=0.0.0.0,
  # STEALTHTAP_HOST=<dns name>, STEALTHTAP_PUBLIC_API=https://<dns name>:8443 and STEALTHTAP_CORS_ORIGINS=https://<dns name> to serve the LAN.
  proxy:
    image: caddy:2
    environment:
      - STEALTHTAP_HOST=${STEALTHTAP_HOST:-localhost}
      - STEALTHTAP_TLS=${STEALTHTAP_TLS:-internal}
      - STEALTHTAP_API_UPSTREAMS=${STEALTHTAP_API_UPSTREAMS:-api:8000}
    ports:
      - "${STEALTHTAP_BIND:-127.0.0.1}:443:443"
      - "${STEALTHTAP_BIND:-127.0.0.1}:8443:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - stealthtap_proxy_data:/data
      - stealthtap_proxy_config:/config
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

  # ── LIVE TAP ──────────────────────────────────────────────────────────
  # Enable with:  docker compose --profile tap up -d sensor
  # Runs on the monitoring host, captures $CAPTURE_IFACE at kernel level,
  # runs the full engine + ONNX pipeline, and forwards alerts to the API's
  # shared PostgreSQL store. Stealth: host network, only NET_RAW/NET_ADMIN,
  # NO published ports (control API bound to 127.0.0.1), read-only rootfs.
  sensor:
    profiles: ["tap"]
    build:
      context: .
      dockerfile: sensor.Dockerfile
    network_mode: host          # required to see a real host NIC
    cap_drop: ["ALL"]
    cap_add: ["NET_RAW", "NET_ADMIN"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      - STEALTHTAP_API_URL=${STEALTHTAP_API_URL:-http://127.0.0.1:8000}
      - STEALTHTAP_API_KEY=${STEALTHTAP_SENSOR_KEY:-${STEALTHTAP_API_KEY:?set STEALTHTAP_API_KEY in .env}}
      - STEALTHTAP_SPOOL_DIR=/spool          # alerts survive an API/DB outage here and are re-sent in order
      - REDIS_URL=${SENSOR_REDIS_URL:-redis://127.0.0.1:6379/0}
      - MODELS_DIR=/models
      - CAPTURE_IFACE=${CAPTURE_IFACE:-eth0}
      - CAPTURE_BPF=${CAPTURE_BPF:-ip or ip6}
      - LIVE_HIGHSPEED_PPS=${LIVE_HIGHSPEED_PPS:-50000}
      - LIVE_HIGHSPEED_MBPS=${LIVE_HIGHSPEED_MBPS:-200}
    volumes:
      - ./models:/models:ro
      - stealthtap_sensor_spool:/spool
    restart: unless-stopped
    # Headless auto-start on the configured interface. Drop `command:` to
    # run `serve` instead and drive start/stop from the dashboard.
    command: ["run", "--iface", "${CAPTURE_IFACE:-eth0}", "--bpf", "${CAPTURE_BPF:-ip or ip6}", "--buffer-mb", "128", "--json"]

volumes:
  stealthtap_pg_replica:
  stealthtap_captures:
  stealthtap_audit:
  stealthtap_proxy_data:
  stealthtap_proxy_config:
  stealthtap_backups:
  stealthtap_sensor_spool:
  stealthtap_zeek_logs:
  stealthtap_relay_socket:
  stealthtap_postgres_data:
  stealthtap_zeek_incoming:
  stealthtap_zeek_outgoing:
  stealthtap_suricata_incoming:
  stealthtap_suricata_outgoing:
